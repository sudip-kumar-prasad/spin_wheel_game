<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roxstar Spin Wheel System</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="container">
        <header class="glass-panel">
            <h1>Roxstar Spin Wheel</h1>
            <div id="user-info" class="user-info hidden">
                <span>Welcome, <strong id="current-username"></strong></span>
                <span class="badge" id="current-role"></span>
                <span class="coin-balance">🪙 <span id="current-coins"></span></span>
            </div>
        </header>

        <div class="dashboard grid">
            <section class="glass-panel controls-section">
                <h2>Controls</h2>
                
                <div id="auth-box" class="action-box">
                    <h3>Register User</h3>
                    <input type="text" id="username-input" placeholder="Enter username..." />
                    <select id="role-input">
                        <option value="user">Player</option>
                        <option value="admin">Admin</option>
                    </select>
                    <button id="btn-create-user" class="btn-primary">Login / Register</button>
                </div>

                <div id="admin-controls" class="action-box hidden">
                    <h3>Admin Controls</h3>
                    <div class="input-group">
                        <input type="number" id="entry-fee" placeholder="Entry Fee (Coins)" value="100" />
    <button id="dash-btn-start" class="btn-success">Start Wheel Manually</button>
<button id="dash-btn-abort" class="btn-danger">Abort Wheel</button>
                    </div>
                </div>

                <div id="player-controls" class="action-box hidden">
                    <h3>Player Actions</h3>
                    <button id="btn-join-wheel" class="btn-primary">Join Active Wheel (Cost: <span id="display-fee">?</span> 🪙)</button>
                </div>

                <div id="player-stats-box" class="action-box hidden" style="margin-top: 1.5rem;">
                    <h3>My Stats</h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 0.75rem;">
                        <div style="background: rgba(255,255,255,0.02); padding: 0.5rem; border-radius: 8px; border: 1px solid var(--glass-border);">
                            <div style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Played</div>
                            <div style="font-size: 1.2rem; font-weight: bold; margin-top: 0.25rem;" id="player-stats-played">0</div>
                        </div>
                        <div style="background: rgba(255,255,255,0.02); padding: 0.5rem; border-radius: 8px; border: 1px solid var(--glass-border);">
                            <div style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Won</div>
                            <div style="font-size: 1.2rem; font-weight: bold; margin-top: 0.25rem;" id="player-stats-won">0</div>
                        </div>
                        <div style="background: rgba(255,255,255,0.02); padding: 0.5rem; border-radius: 8px; border: 1px solid var(--glass-border);">
                            <div style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Earned</div>
                            <div style="font-size: 1.2rem; font-weight: bold; margin-top: 0.25rem;" id="player-stats-earned">0</div>
                        </div>
                        <div style="background: rgba(255,255,255,0.02); padding: 0.5rem; border-radius: 8px; border: 1px solid var(--glass-border);">
                            <div style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Profit/Loss</div>
                            <div style="font-size: 1.2rem; font-weight: bold; margin-top: 0.25rem;" id="player-stats-profit">0</div>
                        </div>
                    </div>
                    
                    <h3 style="margin-top: 1.5rem;">My Activity Logs</h3>
                    <div id="player-logs-list" style="margin-top: 0.5rem; max-height: 150px; overflow-y: auto; font-size: 0.8rem; border-radius: 8px; background: rgba(0,0,0,0.2); padding: 0.5rem; border: 1px solid var(--glass-border);">
                        <div style="color: var(--text-muted); text-align: center; padding: 1rem;">No transactions yet.</div>
                    </div>
                </div>
            </section>

            <section class="glass-panel wheel-section">
                <h2>Live Spin Wheel</h2>
                <div class="wheel-status">
                    <span id="wheel-status-badge" class="badge warning">No Active Wheel</span>
                </div>
                
                <div class="wheel-container">
                    <div id="wheel" class="wheel empty">
                        <div class="wheel-inner">
                            <span id="wheel-center-text">Waiting...</span>
                        </div>
                    </div>
                    <div class="wheel-pointer"></div>
                </div>

                <div class="participant-list-container">
                    <h3>Participants (<span id="participant-count">0</span>)</h3>
                    <ul id="participant-list" class="participant-list">
                    </ul>
                </div>
            </section>

            <section class="glass-panel logs-section">
                <h2>Real-Time Logs</h2>
                <div id="event-logs" class="event-logs">
                </div>
            </section>
        </div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
